name: Windows EXE Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bagimliliklari yukle
        run: npm install

      - name: EXE derle
        run: npm run dist

      - name: Kurulum dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: guvenli-sube-setup
          path: dist/*.exe
          if-no-files-found: error
